<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kursbuch</title>
    <link rel="stylesheet" href="/src/nojo/nojo-ui.css" />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body class="n-window">
    <!-- Ein Dashboard, die ganze Fensterbreite. Kopf (rahmenlos, zum Ziehen): Marke und Semester links, rechts Status;
         dazwischen die freie Zone, wo die Notch sitzt. Darunter der Zeitstrahl, dann links Kalender, in der Mitte die
         Kurse, rechts Fristen und Neues. Alles Schwebende ist Liquid Glass ueber dem farbigen Nebel (main.ts setzt ihn). -->
    <header class="top" data-tauri-drag-region>
      <div class="grp l" data-tauri-drag-region>
        <div class="brand n-glass n-liquid" data-tauri-drag-region><i data-icon="kursbuch"></i><span>Kursbuch</span></div>
        <nav class="sems n-seg n-liquid" aria-label="Semester"></nav>
      </div>
      <div class="nz" data-tauri-drag-region></div>
      <div class="grp r" data-tauri-drag-region>
        <button class="n-ico sm n-glass n-liquid find" title="Suchen (Strg+K)" aria-label="Suchen"><i data-icon="search"></i></button>
        <button class="n-ico sm n-glass n-liquid drawer" data-drawer="dl" title="Kalender"><i data-icon="kalender"></i></button>
        <button class="n-ico sm n-glass n-liquid drawer" data-drawer="dr" title="Fristen und Neues"><i data-icon="abgabe"></i></button>
        <span class="sync n-glass n-liquid" role="status" title="Letzter Sync"><i class="dot"></i><span class="sync-t">–</span></span>
      </div>
    </header>

    <div class="app">
      <div id="tl-host"></div>
      <div class="cols">
        <div class="slot l" id="slot-l"></div>
        <div class="slot c" id="slot-c"></div>
        <div class="slot r" id="slot-r"></div>
      </div>
    </div>
    <div class="scrim" hidden></div>
    <div class="toast n-glass n-liquid panel" role="alert" hidden></div>
    <div class="sr" aria-live="polite"></div>
  </body>
</html>
