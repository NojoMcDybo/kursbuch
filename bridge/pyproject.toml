[project]
name = "learnweb-bridge"
version = "0.1.0"
description = "Python-Bruecke von Kursbuch: Anmeldung, Abgleich und Suche fuer LearnWeb (Uni Muenster)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "keyring>=25",
    "pypdf>=6.20.1",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "hypothesis>=6.169.1",
    "pytest>=9.1.1",
]
